name: Validate published site
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    env:
      SITE_CONTENT_MODE: snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot:check
      - run: npm run test:snapshot
      - run: node --test scripts/bibliography.test.mjs scripts/markdown-content.test.mjs
      - run: npm run build:pages
      - run: npm run check:export
      - run: npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: published-site-preview
          path: docs/
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated public site
        id: deployment
        uses: actions/deploy-pages@v4
