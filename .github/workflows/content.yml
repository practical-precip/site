name: Validate published site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-latest
    env:
      SITE_CONTENT_MODE: snapshot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot:check
      - run: npm run test:snapshot
      - run: npm run build:pages
      - run: npm run check:export
      - run: npm run lint
      - uses: actions/upload-artifact@v4
        with:
          name: published-site-preview
          path: docs/
          include-hidden-files: true
          retention-days: 7
