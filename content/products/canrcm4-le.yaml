id: canrcm4-le
name: CanRCM4 Large Ensemble
provider: Environment and Climate Change Canada
version: >-
  Family/configuration described in the pinned NCAR matrix; see source scope and
  field-specific qualifications.
summary: >-
  A large initial-condition ensemble samples internal variability under one parent GCM. It
  does not span structural uncertainty across many GCMs. This is distinct from bias-adjusted
  CanLEAD.
source_scope: >-
  NCAR matrix transcription. Provider and publication links are supplied for follow-up; only
  sources explicitly marked checked below were independently read. Download availability and
  data files were not tested.
