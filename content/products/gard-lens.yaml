provider: NSF NCAR and Cornell University; NCAR GDEX
method:
  family: Statistical downscaling
  description: >-
    Generalized Analog Regression Downscaling (GARD), configured for the published large
    ensemble.
  reference_dataset: GMET target fields and ERA5 large-scale predictors.
  training_period: 1980-2014 for CONUS and Alaska; 1990-2014 for Hawaii.
coverage:
  domain: CONUS, Alaska, and Hawaii.
  grid: Regular latitude-longitude grid.
  grid_spacing:
    value: 12
    unit: km in CONUS; 4 km in Alaska; 1 km in Hawaii (nominal)
  timestep: Daily
  historical: 1950-2014; EC-Earth3 begins in 1970.
  future: 2015-2100
  scenarios:
    - SSP3-7.0
  variables:
    - name: pcp
      unit: Inspect precipitation accumulation units in the selected NetCDF file.
      description: >-
        Precipitation. Confirm whether the selected variable is a rate or accumulated
        amount.
    - name: t_mean
      unit: Check selected files.
      description: Daily mean temperature.
    - name: t_range
      unit: Check selected files.
      description: Daily temperature range.
  calendar: >-
    Not verified from data files. Read the time coordinate, calendar, and accumulation
    interval before combining products.
ensemble:
  driving_models: 'CMIP6: CESM2, CanESM5, EC-Earth3'
  model_count: 3
  members: >-
    200 initial-condition members in total. Retain parent-model identity in uncertainty
    analysis.
  member_counts:
    - model: CESM2
      count: 100
      scope: Historical and SSP3-7.0, 1950-2100.
      source_url: https://www.nature.com/articles/s41597-024-04205-z
    - model: CanESM5
      count: 50
      scope: Historical and SSP3-7.0, 1950-2100.
      source_url: https://www.nature.com/articles/s41597-024-04205-z
    - model: EC-Earth3
      count: 50
      scope: Historical and SSP3-7.0, 1970-2100.
      source_url: https://www.nature.com/articles/s41597-024-04205-z
access:
  landing_page: https://gdex.ucar.edu/datasets/d619000/
  data: https://gdex.ucar.edu/datasets/d619000/
  format: NetCDF; inspect the selected distribution.
  license: >-
    Creative Commons Attribution 4.0 International, explicitly listed under Data License in
    NCAR GDEX.
  license_url: https://gdex.ucar.edu/datasets/d619000/
  subsetting: >-
    Download access is documented; a server-side spatial/time subsetting service has not
    been verified.
  cost: >-
    Public access is documented. Download fees and platform processing costs have not been
    independently checked.
verified_on: '2026-09-11'
relevant_rows:
  - annual-precipitation
  - annual-maximum
  - intermittency
  - spatial-coherence
