provider: Climate Impact Lab; Microsoft Planetary Computer distribution
method:
  family: Statistical downscaling
  description: >-
    Quantile Delta Mapping (QDM), then Quantile-Preserving Localized-Analog Downscaling
    (QPLAD).
  reference_dataset: ERA5
  training_period: 1995-2014
coverage:
  domain: Global quarter-degree grid; verify application masks.
  grid: Regular latitude-longitude grid.
  grid_spacing:
    value: 0.25
    unit: degrees
  timestep: Daily
  historical: 1950-2014
  future: 2015-2099 or 2100, depending on the source GCM.
  scenarios:
    - SSP1-2.6
    - SSP2-4.5
    - SSP3-7.0
    - SSP5-8.5
  variables:
    - name: pr
      unit: Daily cumulative precipitation; verify units in the selected Zarr store.
      description: Daily precipitation.
    - name: tasmin
      unit: K; verify the selected distribution.
      description: Daily minimum near-surface temperature.
    - name: tasmax
      unit: K; verify the selected distribution.
      description: Daily maximum near-surface temperature.
  calendar: >-
    365-day record excluding leap days, according to the Planetary Computer collection
    description.
ensemble:
  driving_models: CMIP6
  model_count: 25
  members: One selected ensemble member per GCM; scenario availability varies.
  member_counts:
    - model: Each GCM in the described archive
      count: 1
      scope: A selected member for each GCM; available scenarios differ.
      source_url: https://gmd.copernicus.org/articles/17/191/2024/
access:
  landing_page: https://github.com/ClimateImpactLab/downscaleCMIP6
  data: https://planetarycomputer.microsoft.com/dataset/group/cil-gdpcir/
  format: Partitioned Zarr stores on Microsoft Planetary Computer.
  license: >-
    Model-dependent collections: CC0-1.0 or CC-BY-4.0. Check the collection containing each
    selected model.
  license_url: https://planetarycomputer.microsoft.com/dataset/cil-gdpcir-cc-by
  subsetting: >-
    Chunked Zarr stores allow client-side selection of variables, regions, and time. This is
    not a claim of a server-side subset API.
  cost: >-
    The paper describes freely available data. User compute, storage, or platform charges
    are not estimated.
verified_on: '2026-09-11'
relevant_rows:
  - annual-precipitation
  - annual-maximum
  - intermittency
  - spatial-coherence
id: gdpcir
name: GDPCIR
version: Dataset described by Gergel et al. (2024); collection licenses vary by model.
