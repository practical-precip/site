provider: Scripps Institution of Oceanography, UC San Diego
method:
  family: Statistical downscaling
  description: Localized constructed analogs (LOCA).
  reference_dataset: Livneh; distinct from the unsplit precipitation training used for LOCA2.
  training_period: Not recorded in the sources checked; inspect the release documentation.
coverage:
  domain: North America from central Mexico through southern Canada.
  grid: Regular latitude-longitude grid.
  grid_spacing:
    value: 0.0625
    unit: degrees (1/16 degree)
  timestep: Daily
  historical: 1950-2005
  future: 2006-2100; some model records end in 2099.
  scenarios:
    - RCP4.5
    - RCP8.5
  variables:
    - name: pr
      unit: Inspect the variable units and time bounds in the selected files.
      description: >-
        Precipitation. Confirm whether the selected variable is a rate or accumulated
        amount.
    - name: tasmin
      unit: K; verify the selected distribution.
      description: Daily minimum near-surface temperature.
    - name: tasmax
      unit: K; verify the selected distribution.
      description: Daily maximum near-surface temperature.
  calendar: >-
    Not verified from data files. Read the time coordinate, calendar, and accumulation
    interval before combining products.
ensemble:
  driving_models: CMIP5
  model_count: 32
  members: Model/member/scenario availability must be checked in the selected archive.
  member_counts: []
access:
  landing_page: https://loca.ucsd.edu/
  data: https://loca.ucsd.edu/
  format: NetCDF; inspect the selected distribution.
  license: >-
    Dataset reuse terms were not verified. Consult the provider; the article or code license
    is not a data license.
  license_url: null
  subsetting: >-
    Download access is documented; a server-side spatial/time subsetting service has not
    been verified.
  cost: >-
    Public access is documented. Download fees and platform processing costs have not been
    independently checked.
verified_on: '2026-09-11'
relevant_rows:
  - annual-precipitation
  - annual-maximum
  - intermittency
  - spatial-coherence
