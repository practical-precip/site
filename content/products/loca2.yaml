id: loca2
name: LOCA2 North America
version: Precipitation v20240915; original ensemble described by Pierce et al. (2023)
summary: >-
  Daily CMIP6 projections using localized constructed analogs on a roughly 6 km North
  American grid.
provider: Scripps Institution of Oceanography, UC San Diego
method:
  family: Statistical downscaling
  description: Localized constructed analogs, LOCA version 2.
  reference_dataset: Unsplit Livneh precipitation; consult variable-specific training documentation.
  training_period: 1950-2014 precipitation training record.
coverage:
  domain: >-
    North American land domain, including CONUS and parts of Canada and Mexico. Check the
    supplied land mask for the study basin.
  grid: Regular latitude-longitude grid.
  grid_spacing:
    value: 0.0625
    unit: degrees (approximately 6 km)
  timestep: Daily
  historical: 1950-2014
  future: 2015-2100; inspect individual model end dates.
  scenarios:
    - SSP2-4.5
    - SSP3-7.0
    - SSP5-8.5
  variables:
    - name: pr
      unit: Read precipitation units and accumulation conventions from the selected files.
      description: Daily precipitation.
  calendar: Inspect time coordinates and calendars in each selected file.
ensemble:
  driving_models: CMIP6
  model_count: 27
  members: >-
    Up to 10 initial-condition members per model in the 2023 description; availability
    varies by model and scenario.
  member_counts: []
access:
  landing_page: https://loca.ucsd.edu/
  data: https://loca.ucsd.edu/
  format: NetCDF
  license: >-
    Not recorded here. Confirm redistribution and attribution terms with the provider before
    redistributing files.
  license_url: null
  subsetting: >-
    Download access is documented; a server-side spatial/time subsetting service has not
    been verified.
  cost: >-
    Public access is documented. Download fees and platform processing costs have not been
    independently checked.
references:
  - pierce-loca2
metadata_sources:
  - url: https://loca.ucsd.edu/
    locator: September 22, 2024 precipitation release notice and domain description.
  - url: https://loca.ucsd.edu/training-observed-data-sets/
    locator: LOCA2 precipitation training data.
  - url: >-
      https://cirrus.ucsd.edu/~pierce/papers/Pierce_et_al_JHM_2023_LOCA2_precip_extremes_VoR.pdf
    locator: Abstract and data/methods; original ensemble scope.
  - url: >-
      https://raw.githubusercontent.com/NCAR/hydro-climate-evaluation/28f529dc6a265dbf669e6fd38ec20e7ee11c1998/docs/downscalingMethodsMatrixPublic.36x24.pdf
    locator: >-
      Page 1, combined LOCA versions 1 and 2 row. Existing version-specific provider
      metadata takes precedence.
  - url: https://www.nature.com/articles/s41597-024-04205-z
    locator: >-
      Methods: comparison datasets, identifying LOCA2 use in the Fifth National Climate
      Assessment.
verified_on: '2026-09-11'
guidance: product-guidance/loca2.md
