provider: Climatology Lab / University of Idaho; Northwest Knowledge Network distribution
method:
  family: Statistical downscaling
  description: Multivariate Adaptive Constructed Analogs (MACA).
  reference_dataset: gridMET (METDATA)
  training_period: >-
    1979-2012 reference record. This is the available reference-record span, not a confirmed
    calibration window. The provider FAQ also describes 1979-2009 training statistics;
    confirm the exact MACAv2 configuration.
coverage:
  domain: >-
    CONUS-plus; verify the selected grid mask. Livneh coverage includes the Canadian
    Columbia River basin.
  grid: Regular latitude-longitude grid.
  grid_spacing:
    value: 0.041666666666666664
    unit: degrees (1/24 degree, approximately 4 km)
  timestep: Daily
  historical: 1950-2005
  future: 2006-2100; some model records end in 2099.
  scenarios:
    - RCP4.5
    - RCP8.5
  variables:
    - name: pr
      unit: mm (daily amount in the Earth Engine distribution)
      description: >-
        Precipitation. Confirm whether the selected variable is a rate or accumulated
        amount.
    - name: tasmin
      unit: K; verify the selected distribution.
      description: Daily minimum near-surface temperature.
    - name: tasmax
      unit: K; verify the selected distribution.
      description: Daily maximum near-surface temperature.
  calendar: >-
    Not verified from data files. Read the time coordinate, calendar, and accumulation
    interval before combining products.
ensemble:
  driving_models: CMIP5
  model_count: 20
  members: Model/member/scenario availability must be checked in the selected archive.
  member_counts: []
access:
  landing_page: https://www.climatologylab.org/maca.html
  data: https://www.climatologylab.org/maca.html
  format: NetCDF4 and THREDDS/OPeNDAP; METDATA also has Earth Engine and USGS access.
  license: >-
    MACA datasets are public domain in the US and carry a CC0 1.0 dedication unless
    otherwise noted; cite the dataset and acquisition date.
  license_url: https://www.climatologylab.org/maca.html
  subsetting: >-
    Provider links point CSV extraction, regional NetCDF downloads, and THREDDS/OPeNDAP
    access.
  cost: >-
    Public-domain data with provider download services. Costs of optional analysis platforms
    are not established here.
verified_on: '2026-09-11'
relevant_rows:
  - annual-precipitation
  - annual-maximum
  - intermittency
  - spatial-coherence
