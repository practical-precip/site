provider: Participating NA-CORDEX modeling groups; NCAR GDEX
method:
  family: Dynamical downscaling
  description: Multiple regional climate models driven by CMIP5 boundary conditions.
  reference_dataset: >-
    Not applicable to native dynamical runs. Reference data depend on any subsequent bias
    correction.
  training_period: >-
    Not applicable to native runs; consult the selected bias-corrected product when
    relevant.
coverage:
  domain: Most of North America; regional model masks and grids differ.
  grid: Native regional grids or derived common grids; record which is used.
  grid_spacing:
    value: 0.22
    unit: degrees for approximately 25 km runs; 0.44 degrees for approximately 50 km runs
  timestep: Daily products; other variables and frequencies vary by archive.
  historical: 1950-2005
  future: 2006-2100; coverage varies by GCM-RCM experiment.
  scenarios:
    - RCP4.5
    - RCP8.5
  variables:
    - name: pr
      unit: Inspect the variable units and time bounds in the selected files.
      description: >-
        Precipitation. Confirm whether the selected variable is a rate or accumulated
        amount.
  calendar: >-
    Not verified from data files. Read the time coordinate, calendar, and accumulation
    interval before combining products.
ensemble:
  driving_models: CMIP5
  model_count: null
  members: >-
    Uneven GCM-RCM-scenario matrix. Count unique parent GCMs separately from RCMs,
    resolutions, and simulations.
  member_counts: []
access:
  landing_page: https://na-cordex.org/data-access.html
  data: https://gdex.ucar.edu/datasets/d316009/
  format: >-
    NetCDF in the core archive; a separately documented Zarr distribution is available on
    AWS and GDEX d316010.
  license: >-
    NA-CORDEX terms permit commercial use and require dataset citation and acknowledgements;
    consult the full terms.
  license_url: https://na-cordex.org/terms-use.html
  subsetting: >-
    Select archive files by variable, scenario, GCM, RCM, output frequency, grid, and bias
    correction. The Zarr distribution supports client-side chunk access.
  cost: >-
    NA-CORDEX documents AWS-sponsored storage and egress for its public Zarr copy. User
    analysis costs are not included.
verified_on: '2026-09-11'
relevant_rows:
  - annual-precipitation
  - annual-maximum
  - intermittency
  - spatial-coherence
