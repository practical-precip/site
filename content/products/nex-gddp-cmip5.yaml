provider: NASA Earth Exchange / Climate Analytics Group / NCCS
method:
  family: Statistical downscaling
  description: Bias correction and spatial disaggregation (BCSD).
  reference_dataset: Global Meteorological Forcing Dataset (GMFD), as listed in the NCAR matrix.
  training_period: Not recorded in the sources checked; inspect the release documentation.
coverage:
  domain: Global; verify land mask and spatial coverage in the selected files.
  grid: Regular latitude-longitude grid.
  grid_spacing:
    value: 0.25
    unit: degrees
  timestep: Daily
  historical: 1950-2005
  future: >-
    2006-2099 in NCCS summary; Earth Engine lists through 2100. Check the selected
    model/distribution.
  scenarios:
    - RCP4.5
    - RCP8.5
  variables:
    - name: pr
      unit: kg m-2 s-1 (daily mean precipitation flux in Earth Engine)
      description: >-
        Precipitation. Confirm whether the selected variable is a rate or accumulated
        amount.
    - name: tasmin
      unit: K; verify the selected distribution.
      description: Daily minimum near-surface temperature.
    - name: tasmax
      unit: K; verify the selected distribution.
      description: Daily maximum near-surface temperature.
  calendar: >-
    Not verified from data files. Read the time coordinate, calendar, and accumulation
    interval before combining products.
ensemble:
  driving_models: CMIP5
  model_count: 21
  members: Model/member/scenario availability must be checked in the selected archive.
  member_counts: []
access:
  landing_page: https://www.nccs.nasa.gov/nex-gddp/
  data: https://registry.opendata.aws/nasanex/
  format: NetCDF4 classic; also distributed through Earth Engine.
  license: Public domain, as stated by the Earth Engine dataset distribution.
  license_url: https://developers.google.com/earth-engine/datasets/catalog/NASA_NEX-GDDP
  subsetting: >-
    NCCS lists THREDDS search, subset, download, and visualization services. Service
    operation was not tested.
  cost: >-
    Data are public domain. Public S3 distribution is listed; optional platform and analysis
    costs are not estimated.
