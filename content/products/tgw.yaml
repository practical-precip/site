provider: IM3 / HyperFACETS collaboration; MSD-LIVE data portal
method:
  family: Dynamical downscaling with thermodynamic perturbations
  description: >-
    WRF 4.2.1 driven by ERA5, then by ERA5 with time-varying temperature and moisture
    perturbations.
  reference_dataset: ERA5 historical weather sequence.
  training_period: No statistical calibration. Historical weather baseline is 1980-2019.
coverage:
  domain: Continental United States regional model domain.
  grid: WRF regional grid, 425 by 300 cells in the paper.
  grid_spacing:
    value: 12
    unit: km
  timestep: >-
    Hourly for 25 variables and 3-hourly for more than 200 variables in the 2023
    description.
  historical: 1980-2019
  future: 2020-2059 and 2060-2099, each replaying the 1980-2019 weather sequence.
  scenarios:
    - SSP2-4.5, lower-sensitivity warming
    - SSP2-4.5, higher-sensitivity warming
    - SSP5-8.5, lower-sensitivity warming
    - SSP5-8.5, higher-sensitivity warming
  variables:
    - name: precipitation (WRF variable names)
      unit: Inspect accumulation variables, resets, and output intervals.
      description: >-
        Precipitation. Confirm whether the selected variable is a rate or accumulated
        amount.
  calendar: >-
    Not verified from data files. Read the time coordinate, calendar, and accumulation
    interval before combining products.
ensemble:
  driving_models: ERA5 weather with warming signals derived from groups of CMIP6 models.
  model_count: null
  members: >-
    Four 80-year warming trajectories, implemented as eight 40-year future simulations, plus
    the historical simulation. Not an initial-condition ensemble.
  member_counts: []
access:
  landing_page: https://tgw-data.msdlive.org/
  data: https://tgw-data.msdlive.org/
  format: NetCDF data with Globus access through MSD-LIVE.
  license: >-
    Dataset reuse terms were not verified. Consult the provider; the article or code license
    is not a data license.
  license_url: null
  subsetting: >-
    Download access is documented; a server-side spatial/time subsetting service has not
    been verified.
  cost: >-
    Public access is documented. Download fees and platform processing costs have not been
    independently checked.
verified_on: '2026-09-11'
relevant_rows:
  - annual-precipitation
  - annual-maximum
  - intermittency
  - spatial-coherence
