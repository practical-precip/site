provider: UCLA Center for Climate Science and collaborators
method:
  family: Dynamical downscaling
  description: WRF 4.1.3, with 45 km outer and 9 km inner domains.
  reference_dataset: >-
    GCM boundary forcing; separate ERA5-driven reference simulation. No statistical training
    target for the original GCM-driven runs.
  training_period: Not applicable to the dynamical model. Evaluation in the paper uses 1981-2010.
coverage:
  domain: Western United States, including the WECC US region; use the inner-domain mask.
  grid: WRF regional model grid; use supplied coordinates and projection.
  grid_spacing:
    value: 9
    unit: km (inner domain; 45 km outer domain)
  timestep: Hourly selected variables; other output frequencies depend on tier.
  historical: 1980-2014
  future: 2015-2100
  scenarios:
    - SSP3-7.0
    - SSP2-4.5 (CESM2 only in the original paper)
    - SSP5-8.5 (CESM2 only in the original paper)
  variables:
    - name: precipitation (tier-dependent variable names)
      unit: Inspect WRF accumulation conventions, resets, and time intervals.
      description: >-
        Precipitation. Confirm whether the selected variable is a rate or accumulated
        amount.
  calendar: >-
    Not verified from data files. Read the time coordinate, calendar, and accumulation
    interval before combining products.
ensemble:
  driving_models: CMIP6
  model_count: 14
  members: >-
    16 simulations in the original paper: 14 SSP3-7.0 projections plus two additional CESM2
    scenarios. These are not 16 different GCMs.
  member_counts: []
access:
  landing_page: https://registry.opendata.aws/wrf-cmip6/
  data: https://registry.opendata.aws/wrf-cmip6/
  format: WRF NetCDF output, organized into data tiers in AWS S3.
  license: Creative Commons Attribution 4.0 International, per the AWS dataset registry.
  license_url: https://registry.opendata.aws/wrf-cmip6/
  subsetting: >-
    Download access is documented; a server-side spatial/time subsetting service has not
    been verified.
  cost: >-
    AWS registry provides public S3 access with no AWS account required. User processing and
    storage costs are not estimated.
verified_on: '2026-09-11'
relevant_rows:
  - annual-precipitation
  - annual-maximum
  - intermittency
  - spatial-coherence
