# yaml-language-server: $schema=../schema.json#/definitions/row
id: intermittency
title: Intermittency
short: Wet & dry spells
use: Drought, agriculture & runoff timing
intro: >-
  Define a wet interval before counting wet days or spells. Then evaluate both
  occurrence and persistence. Matching the precipitation distribution does not establish
  that the sequence is useful.
metrics:
  - Wet-interval frequency
  - Wet and dry spell lengths
  - Occurrence transitions
references:
  - lange
  - value
figure:
  title: Wet frequency does not identify spell length.
  alt: >-
    Two constructed 12-day rainfall sequences contain six wet days and 12 mm total. One
    alternates wet and dry days; the other groups six wet days together.
  caption: >-
    Both sequences have six wet days and 12 mm of precipitation. At a threshold of 1
    mm/day, the longest dry spell within the displayed window is one day in the
    alternating sequence and six days in the clustered sequence.
  image: /figures/intermittency.png
  pdf: /figures/intermittency.pdf
  provenance: >-
    Original synthetic example, generated with Matplotlib. No observations or
    downscaling product output are shown.
  data: /figures/examples.json
  code: /figures/make_figures.py
