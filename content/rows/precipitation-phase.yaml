# yaml-language-server: $schema=../schema.json#/definitions/row
id: precipitation-phase
title: Precipitation phase
short: Rain versus snow
use: Snowpack & seasonal water storage
intro: >-
  Total precipitation alone does not identify phase. Establish whether rain and snow are
  provided directly or diagnosed from other variables, and evaluate the partitioning
  method.
metrics:
  - Rain fraction by elevation
  - Seasonal snowfall water equivalent
  - Phase classification error
references:
  - jennings
  - lehner
figure:
  title: The assumed transition changes the rain fraction.
  alt: >-
    Two illustrative sigmoid curves show different rain fractions at the same air
    temperature when the assumed transition midpoint shifts from 0 to 2 degrees Celsius.
  caption: >-
    These logistic curves are mathematical illustrations with chosen transition
    midpoints of 0 and 2 degrees Celsius and slope scale 0.8 degrees Celsius. They are
    not fitted phase models or recommended thresholds. See Jennings et al. below for
    observational evidence.
  image: /figures/precipitation-phase.png
  pdf: /figures/precipitation-phase.pdf
  provenance: >-
    Original synthetic example, generated with Matplotlib. No observations or
    downscaling product output are shown.
  data: /figures/examples.json
  code: /figures/make_figures.py
