# Row and column order here controls the website. Keep IDs stable.
# yaml-language-server: $schema=./schema.json#/definitions/table
version: 1
columns:
  - id: spatial
    title: Spatial resolution
    subtitle: Grid spacing & support
    definition: >-
      The spacing of the output grid, and the area each value represents. A fine output
      grid does not by itself establish the scale of credible information.
  - id: temporal
    title: Temporal resolution
    subtitle: Hourly, daily, monthly
    definition: >-
      The interval and accumulation window of each output value. Match these to the
      process and statistic your application needs.
  - id: models
    title: GCM ensemble size
    subtitle: Different climate models
    definition: >-
      The number and diversity of driving global climate models. Count models separately
      from initial-condition members and downscaling methods.
  - id: members
    title: Internal variability
    subtitle: Members within a model
    definition: >-
      Multiple simulations of the same climate model and forcing, started from different
      initial conditions. These sample different plausible climate sequences.
  - id: domain
    title: Geographic domain
    subtitle: Coverage & boundaries
    definition: >-
      The geographic footprint of the product, including your complete study area. CONUS
      means the contiguous United States.
  - id: coverage
    title: Temporal coverage
    subtitle: Baseline & future period
    definition: >-
      The years, continuity, and scenarios available for your baseline and planning
      horizon. This is different from the timestep.
rows:
  - annual-precipitation
  - annual-maximum
  - intermittency
  - precipitation-phase
  - spatial-coherence
